version: '3.8'


x-airflow-common:
  &airflow-common
  environment:
    AIRFLOW_UID: 50000
    AIRFLOW_GID: 1001



services:
  postgres:
    <<: *airflow-common
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etl_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: 12345
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - etl_network
    volumes:
      - postgres_data:/var/lib/postgresql/data


  airflow-init:
    <<: *airflow-common
    image: apache/airflow:2.9.2
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "lIWYKyUjKAX6zUKvUZJPIxjZtvYjvR9RX92VkNytDd3eVPtH-C8A1CgldBVaTeL0u2HiXHjkmSA"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl_project:/opt/airflow/etl
    user: "0:0"
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Imran --lastname Dubai --role Admin --email imranndubai@icloud.com || true"
    networks:
      - etl_network
      

  airflow-webserver:
    <<: *airflow-common
    user: "0:0"
    image: apache/airflow:2.9.2
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "lIWYKyUjKAX6zUKvUZJPIxjZtvYjvR9RX92VkNytDd3eVPtH-C8A1CgldBVaTeL0u2HiXHjkmSA"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dags:/opt/airflow/dags
      - ./etl_project:/opt/airflow/etl
    ports:
      - "8080:8080"
    command: airflow webserver
    networks:
      - etl_network

  airflow-scheduler:
    <<: *airflow-common
    user: "0:0"
    image: apache/airflow:2.9.2
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "lIWYKyUjKAX6zUKvUZJPIxjZtvYjvR9RX92VkNytDd3eVPtH-C8A1CgldBVaTeL0u2HiXHjkmSA"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dags:/opt/airflow/dags
      - ./etl_project:/opt/airflow/etl
    command: airflow scheduler

    networks:
      - etl_network

  etl_project:
    image: etl_project:latest
    build:
      context: ./etl_project
    command: sleep infinity
    volumes:
      - ./etl_project:/app
    networks:
      - etl_network

volumes:
  postgres_data:


networks:
  etl_network:
    driver: bridge